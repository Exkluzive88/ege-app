  <style>
    :root {
      --bg: #f4f6fb; --card: #ffffff; --text: #1e293b; --muted: #64748b;
      --primary: #3b82f6; --primary-dark: #2563eb; --success: #10b981;
      --warning-bg: #fef3c7; --warning-text: #92400e;
      --kid-bg: #eff6ff; --kid-border: #bfdbfe; --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 50px; max-width: 600px; margin: 0 auto; }

    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .logo { font-size: 20px; font-weight: 800; color: var(--primary); }
    .badge { background: #dbeafe; color: var(--primary-dark); font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px; }

    .subjects-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 10px; scrollbar-width: none; }
    .subjects-bar::-webkit-scrollbar { display: none; }
    .subj-btn {
      padding: 8px 14px; border-radius: 20px; border: 1px solid #cbd5e1; background: var(--card);
      font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer; white-space: nowrap;
    }
    .subj-btn.active { background: var(--text); color: #fff; border-color: var(--text); }

    select {
      width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid #cbd5e1;
      background: var(--card); font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 12px; outline: none;
    }

    .task-pills { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 14px; scrollbar-width: none; }
    .task-pills::-webkit-scrollbar { display: none; }
    .pill {
      min-width: 42px; height: 42px; border-radius: 12px; border: 2px solid #e2e8f0;
      background: var(--card); font-weight: 700; font-size: 15px; color: var(--text);
      display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; position: relative;
    }
    .pill.active { border-color: var(--primary); background: var(--primary); color: #fff; }
    .pill.solved { border-color: var(--success); color: var(--success); }
    .pill.active.solved { background: var(--success); color: #fff; }
    .pill .lock { font-size: 10px; position: absolute; top: 2px; right: 3px; }

    .card { background: var(--card); border-radius: var(--radius); padding: 18px; box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05); margin-bottom: 16px; }
    .task-topic { font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
    .task-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
    .task-condition { font-size: 16px; line-height: 1.55; margin-bottom: 16px; background: #f8fafc; padding: 12px; border-radius: 12px; border-left: 4px solid var(--primary); }

    .answer-box { display: flex; gap: 8px; margin-bottom: 12px; }
    input[type="text"] { flex: 1; padding: 12px 14px; border-radius: 12px; border: 2px solid #cbd5e1; font-size: 16px; outline: none; }
    .btn { padding: 12px 18px; border-radius: 12px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-kid { width: 100%; background: #eef2ff; color: #4338ca; border: 1px solid #c7d2fe; margin-top: 4px; }
    .btn-next { width: 100%; background: #f1f5f9; color: var(--text); border: 1px solid #cbd5e1; margin-top: 12px; }
    .btn-pro { width: 100%; background: linear-gradient(135deg, #f59e0b, #ea580c); color: #fff; margin-top: 12px; font-size: 16px; padding: 14px; }

    .feedback { padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 14px; margin-bottom: 12px; display: none; }
    .feedback.ok { display: block; background: #d1fae5; color: #065f46; }
    .feedback.err { display: block; background: #fee2e2; color: #991b1b; }

    .explanation { display: none; margin-top: 16px; }
    .explanation.open { display: block; }
    .kid-block { background: var(--kid-bg); border: 1px solid var(--kid-border); border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .kid-block h4 { color: #1d4ed8; font-size: 15px; margin-bottom: 6px; }
    .kid-block p { font-size: 15px; line-height: 1.5; }

    .step { display: flex; gap: 10px; margin-bottom: 10px; align-items: flex-start; }
    .step-num { width: 24px; height: 24px; border-radius: 50%; background: var(--primary); color: #fff; font-size: 13px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px; }
    .step-text { font-size: 15px; line-height: 1.5; }

    .trap-box { background: var(--warning-bg); color: var(--warning-text); padding: 12px; border-radius: 12px; font-size: 14px; line-height: 1.45; margin-top: 10px; }
    .cheat-box { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 12px; border-radius: 12px; font-size: 14px; margin-top: 10px; }
    .pro-banner { background: #1e293b; color: #fff; border-radius: var(--radius); padding: 18px; text-align: center; }
  </style>
</head>

          title: "Вариант 1 — Базовая математика (Все 21 задание)",
          tasks: [
            { num: 1, free: true, topic: "Текстовые задачи", title: "Задание №1. Покупка тетрадей", condition: "Тетрадь стоит 34 рубля. Какое наибольшее число тетрадей можно купить на 500 рублей после понижения цены на 15%?", answer: "17", analogy: "Сначала узнаем цену со скидкой, затем делим 500 руб. на новую цену и отбрасываем копейки.", steps: ["Скидка 15%: 34 × 0,15 = 5,1 руб.", "Новая цена: 34 − 5,1 = 28,9 руб.", "500 : 28,9 ≈ 17,3 → хватит на 17 тетрадей."], trap: "При покупке на бюджет всегда округляем ВНИЗ до целого.", cheatsheet: "Бюджет / Цена → округление вниз." },
            { num: 2, free: true, topic: "Единицы измерения", title: "Задание №2. Соответствие величин", condition: "Сопоставьте: А) масса слона; Б) площадь поля; В) объем цистерны; Г) длина Волги. Значения: 1) 7000 кв. м; 2) 3530 км; 3) 5 т; 4) 60 куб. м. Запишите цифры без пробелов.", answer: "3142", analogy: "Вес в тоннах, площадь в кв. метрах, объем в кубометрах, длина в километрах.", steps: ["А-3 (5 т), Б-1 (7000 кв. м), В-4 (60 куб. м), Г-2 (3530 км)."], trap: "Пиши цифры строго в порядке АБВГ без пробелов.", cheatsheet: "т — масса | кв. м — площадь | куб. м — объем | км — длина." },

            { num: 4, free: false, topic: "Формулы", title: "Задание №4. Работа тока", condition: "Найдите работу тока по формуле A = I² · R · t, если I = 3 А, R = 12 Ом, t = 5 с.", answer: "540", analogy: "Подставляем числа вместо букв, возведя силу тока I в квадрат.", steps: ["3² = 9.", "9 × 12 × 5 = 540."], trap: "Не забудь возвести 3 в квадрат.", cheatsheet: "Сначала степень, затем умножение." },
            { num: 5, free: false, topic: "Вероятность", title: "Задание №5. Желтое такси", condition: "Свободно 25 машин: 10 черных, 4 желтых, 11 зеленых. Найдите вероятность выезда желтой машины.", answer: "0.16", analogy: "Делим количество желтых машин на общее количество.", steps: ["4 / 25 = 16 / 100 = 0,16."], trap: "Ответ пишется только десятичной дробью: 0,16.", cheatsheet: "P = Нужные / Все." },
            { num: 6, free: false, topic: "Выбор варианта", title: "Задание №6. Дешевый тариф", condition: "Нужно 600 мин. Тариф А: 300 руб. за 400 мин + 2 руб./мин сверх. Тариф Б: 650 руб. Сколько заплатит клиент за дешевый вариант?", answer: "650", analogy: "Считаем полную цену тарифа А с доплатой за 200 лишних минут и сравниваем с тарифом Б.", steps: ["Тариф А: 300 + (600 − 400) × 2 = 700 руб.", "Сравниваем 700 и 650 → выгоднее 650."], trap: "Пишем сумму в рублях (650), а не букву тарифа.", cheatsheet: "Считай полную стоимость каждого варианта." },
            { num: 7, free: false, topic: "Графики", title: "Задание №7. Скорость нагрева", condition: "Нагрев двигателя: 1-й интервал (0–2 мин) с 20° до 50°; 2-й (2–5 мин) с 50° до 80°; 3-й (5–6 мин) с 80° до 100°. На каком интервале (1, 2 или 3) нагрев быстрее?", answer: "3", analogy: "Делим прирост градусов на количество минут на каждом участке.", steps: ["1-й: 30°/2 мин = 15°/мин; 2-й: 30°/3 мин = 10°/мин; 3-й: 20°/1 мин = 20°/мин."], trap: "Обязательно дели градусы на время интервала.", cheatsheet: "Скорость = ΔT / Δt." },
            { num: 8, free: false, topic: "Логика", title: "Задание №8. Кружки в классе", condition: "В классе 25 человек: 15 на плавании, 12 на шахматах. Верны: 1) каждый ходит на кружок; 2) минимум 2 ходят на оба; 3) больше 13 ходят на оба; 4) не более 12 ходят на оба. Запишите цифры без пробелов.", answer: "24", analogy: "Мест в кружках 15+12=27, а учеников 25 — значит минимум 2 человека посещают оба.", steps: ["1 — нет; 2 — да (27−25=2); 3 — нет; 4 — да (максимум 12). Ответ: 24."], trap: "Выписывай цифры без пробелов.", cheatsheet: "Мин. пересечение = A + B − Всего." },

            { num: 10, free: false, topic: "Геометрия", title: "Задание №10. Лестница у стены", condition: "Лестница 10 м приставлена к стене, низ в 6 м от стены. На какой высоте (в м) верхний конец?", answer: "8", analogy: "Прямоугольный треугольник с гипотенузой 10 и катетом 6.", steps: ["h = √(10² − 6²) = √(100 − 36) = √64 = 8."], trap: "Вычитаем квадраты, а не складываем.", cheatsheet: "Треугольник со сторонами 6, 8, 10." },
            { num: 11, free: false, topic: "Стереометрия", title: "Задание №11. Объем детали в воде", condition: "В цилиндр налили 2000 куб. см воды (высота 12 см). После погружения детали уровень поднялся на 3 см. Найдите объем детали.", answer: "500", analogy: "Уровень вырос на 3/12 = 1/4 от высоты, значит объем детали равен четверти объема воды.", steps: ["2000 × (3 / 12) = 2000 / 4 = 500 куб. см."], trap: "Если уровень поднялся ДО 15 см, сначала вычти 15 − 12 = 3 см.", cheatsheet: "V детали = V воды × (Δh / h)." },
            { num: 12, free: false, topic: "Планиметрия", title: "Задание №12. Внешний угол", condition: "В треугольнике ABC угол A = 42°, угол B = 73°. Найдите внешний угол при вершине C (в градусах).", answer: "115", analogy: "Внешний угол равен сумме двух внутренних, не смежных с ним.", steps: ["42° + 73° = 115°."], trap: "Не нужно искать сам угол C, складывай A и B сразу.", cheatsheet: "Внешний угол = ∠A + ∠B." },
            { num: 13, free: false, topic: "Стереометрия", title: "Задание №13. Площадь куба", condition: "Ребро куба равно 4 см. Найдите площадь его полной поверхности (в кв. см).", answer: "96", analogy: "У куба 6 одинаковых квадратных граней. Площадь одной грани умножаем на 6.", steps: ["4 × 4 × 6 = 16 × 6 = 96."], trap: "Не путай площадь (6a²) с объемом (a³).", cheatsheet: "S куба = 6a²." },
            { num: 14, free: false, topic: "Дроби", title: "Задание №14. Вычисление с дробями", condition: "Найдите значение: (3/4 + 1/5) · 20.", answer: "19", analogy: "Раскрываем скобки и умножаем каждую дробь на 20 отдельно.", steps: ["(3/4)·20 + (1/5)·20 = 15 + 4 = 19."], trap: "Целое число умножается только на числитель.", cheatsheet: "(a + b)·c = a·c + b·c." },
            { num: 15, free: false, topic: "Проценты", title: "Задание №15. Подорожание товара", condition: "Футболка стоила 800 руб., стала стоить 920 руб. На сколько процентов повысилась цена?", answer: "15", analogy: "Делим прибавку в рублях на первоначальную цену (800).", steps: ["(920 − 800) / 800 = 120 / 800 = 0,15 = 15%."], trap: "Всегда дели на старую цену (800), а не на новую.", cheatsheet: "% = (Разница / Было) × 100." },
            { num: 16, free: false, topic: "Корни", title: "Задание №16. Произведение корней", condition: "Найдите значение: √18 · √2.", answer: "6", analogy: "При умножении два корня объединяются под один знак.", steps: ["√(18 × 2) = √36 = 6."], trap: "Объединять под один корень можно только при умножении/делении.", cheatsheet: "√a · √b = √(a·b)." },
            { num: 17, free: false, topic: "Уравнения", title: "Задание №17. Логарифмическое уравнение", condition: "Найдите корень уравнения: log₂(x − 3) = 4.", answer: "19", analogy: "Выражение в скобках равно основанию 2 в степени 4.", steps: ["x − 3 = 2⁴ = 16.", "x = 16 + 3 = 19."], trap: "2⁴ = 16, а не 8.", cheatsheet: "logₐ(x) = b ⇔ x = aᵇ." },
            { num: 18, free: false, topic: "Числовая прямая", title: "Задание №18. Сравнение корней", condition: "Какое число лежит между 4 и 5: 1) √14; 2) √22; 3) √28; 4) √35?", answer: "2", analogy: "Переводим границы в корни: 4 = √16, 5 = √25.", steps: ["Между √16 и √25 находится только √22 (вариант 2)."], trap: "В ответ пишем номер варианта (2), а не 22.", cheatsheet: "n = √(n²)." },
            { num: 19, free: false, topic: "Свойства чисел", title: "Задание №19. Делимость на 15", condition: "Найдите трехзначное число больше 400, которое делится на 15, а сумма его цифр равна 9.", answer: "405", analogy: "Число должно кончаться на 0 или 5, а сумма цифр быть 9.", steps: ["Первая цифра 4, последняя 5 → посередине 0. Число 405 (405 : 15 = 27)."], trap: "Подойдет любой верный вариант (405, 450, 540 и др.).", cheatsheet: "Делимость на 15 = на 5 и на 3." },

            { num: 1, free: true, topic: "Планиметрия", title: "Задание №1. Углы в окружности", condition: "AC и BD — диаметры окружности с центром O. Угол AOD равен 108°. Найдите угол ACB (в градусах).", answer: "36", analogy: "Вертикальные углы равны, а радиусы делают треугольник BOC равнобедренным.", steps: ["Угол BOC = 108°; OB = OC.", "(180° − 108°) : 2 = 36°."], trap: "Радиусы одной окружности всегда равны.", cheatsheet: "Вписанный угол = половина центрального." },
            { num: 2, free: true, topic: "Векторы", title: "Задание №2. Длина суммы векторов", condition: "Даны векторы a(3; −4) и b(9; 9). Найдите длину вектора a + b.", answer: "13", analogy: "Складываем координаты по X и по Y, затем считаем длину по Пифагору.", steps: ["(3+9; −4+9) = (12; 5).", "√(12² + 5²) = √169 = 13."], trap: "Не складывай длины отдельных векторов.", cheatsheet: "Длина (x; y) = √(x² + y²)." },
            { num: 3, free: false, topic: "Стереометрия", title: "Задание №3. Отсеченная призма", condition: "Объем треугольной призмы 36. Через среднюю линию основания проведена плоскость параллельно боковому ребру. Найдите объем отсеченной призмы.", answer: "9", analogy: "Стороны основания уменьшились в 2 раза, площадь — в 2² = 4 раза.", steps: ["36 : 4 = 9."], trap: "Делим на 4, а не на 2!", cheatsheet: "Отношение площадей = k²." },
            { num: 4, free: false, topic: "Вероятность", title: "Задание №4. Исправные фонарики", condition: "Из 150 фонариков 12 неисправных. Найдите вероятность выбрать исправный.", answer: "0.92", analogy: "Делим количество хороших фонариков на общее число.", steps: ["(150 − 12) / 150 = 138 / 150 = 0,92."], trap: "Не дели 12 на 150 — это вероятность брака.", cheatsheet: "P = Хорошие / Все." },
            { num: 5, free: false, topic: "Сложные события", title: "Задание №5. Две лампы", condition: "Вероятность перегорания каждой из двух ламп равна 0,3. Найдите вероятность, что хотя бы одна не перегорит.", answer: "0.91", analogy: "Отнимаем от 1 единственный плохой случай — перегорели обе сразу.", steps: ["1 − (0,3 × 0,3) = 1 − 0,09 = 0,91."], trap: "Вероятность не бывает больше 1.", cheatsheet: "P(хотя бы 1) = 1 − P(ни одной)." },
            { num: 6, free: false, topic: "Уравнения", title: "Задание №6. Корень уравнения", condition: "Решите уравнение: √(4x + 5) = 7.", answer: "11", analogy: "Возводим обе части в квадрат, чтобы снять корень.", steps: ["4x + 5 = 49 → 4x = 44 → x = 11."], trap: "Проверяй ОДЗ под корнем.", cheatsheet: "√A = B ⇔ A = B²." },
            { num: 7, free: false, topic: "Степени", title: "Задание №7. Выражение со степенями", condition: "Найдите значение: (5^6 · 5^4) : 5^8.", answer: "25", analogy: "При умножении степени складываются, при делении — вычитаются.", steps: ["6 + 4 − 8 = 2 → 5² = 25."], trap: "Показатели складываем, а не умножаем.", cheatsheet: "aⁿ·aᵐ = aⁿ⁺ᵐ." },
            { num: 8, free: false, topic: "Производная", title: "Задание №8. Касательная", condition: "Прямая y = 6x − 5 параллельна касательной к графику y = x² + 2x − 3. Найдите абсциссу точки касания.", answer: "2", analogy: "Производная в точке касания равна коэффициенту перед x у прямой (6).", steps: ["2x + 2 = 6 → x = 2."], trap: "Абсцисса — это X, ордината — это Y.", cheatsheet: "f'(x₀) = k." },
            { num: 9, free: false, topic: "Формулы", title: "Задание №9. Рейтинг магазина", condition: "R = r_пок − (r_пок − r_экс) / (K + 1)^m, где r_пок = 0,86, r_экс = 0,38, K = 1, m = 3. Найдите R.", answer: "0.8", analogy: "Подставляем числа и считаем по действиям.", steps: ["0,86 − (0,48 / 8) = 0,86 − 0,06 = 0,8."], trap: "Пишем 0,8 без лишнего нуля на конце.", cheatsheet: "Сначала скобки и степень." },
            { num: 10, free: false, topic: "Текстовые задачи", title: "Задание №10. Совместная работа", condition: "Первый рабочий делает на 5 деталей/ч больше второго и выполняет заказ из 200 деталей на 2 ч быстрее. Сколько деталей/ч делает второй?", answer: "20", analogy: "Разница во времени равна 2 часам: 200/x − 200/(x+5) = 2.", steps: ["200/20 − 200/25 = 10 − 8 = 2 → x = 20."], trap: "Проверяй, чью скорость просят: второго (20).", cheatsheet: "t = A / P." },
            { num: 11, free: false, topic: "Графики", title: "Задание №11. Прямая по двум точкам", condition: "Прямая y = kx + b проходит через A(0; −3) и B(2; 5). Найдите y при x = 4.", answer: "13", analogy: "Точка при x = 0 сразу дает b = −3.", steps: ["b = −3; 5 = 2k − 3 → k = 4; y = 4·4 − 3 = 13."], trap: "Первая координата X, вторая Y.", cheatsheet: "Точка (0; b) дает b." },
            { num: 12, free: false, topic: "Экстремумы", title: "Задание №12. Точка минимума", condition: "Найдите точку минимума функции y = x² − 8x + 19.", answer: "4", analogy: "Приравниваем производную к нулю, чтобы найти вершину параболы.", steps: ["y' = 2x − 8 = 0 → x = 4."], trap: "«Точка» = X (4), «значение» = Y.", cheatsheet: "Точка экстремума → y' = 0." }
          ]
        }
      ]
    }
  ];

  let curSubjIdx = 0, curVarIdx = 0, curTaskIdx = 0;
  let isPro = localStorage.getItem("ege_pro") === "true";
  let solvedTasks = JSON.parse(localStorage.getItem("ege_solved") || "{}");

  function initUI() {
    if (isPro) {
      document.getElementById("statusBadge").textContent = "⭐ PRO Доступ";
      document.getElementById("proBanner").style.display = "none";
    }
    renderSubjects();
  }

  function renderSubjects() {
    const bar = document.getElementById("subjectsBar");
    bar.innerHTML = "";
    database.forEach((s, idx) => {
      const btn = document.createElement("button");
      btn.className = "subj-btn" + (idx === curSubjIdx ? " active" : "");
      btn.textContent = s.subject;
      btn.onclick = () => { curSubjIdx = idx; curVarIdx = 0; curTaskIdx = 0; renderSubjects(); };
      bar.appendChild(btn);
    });
    renderVariants();
  }

  function renderVariants() {
    const select = document.getElementById("variantSelect");
    select.innerHTML = "";
    database[curSubjIdx].variants.forEach((v, idx) => {
      const opt = document.createElement("option");
      opt.value = idx;
      opt.textContent = v.title;
      select.appendChild(opt);
    });
    select.value = curVarIdx;
    renderPills();
    renderTask();
  }

  function changeVariant() {
    curVarIdx = Number(document.getElementById("variantSelect").value);
    curTaskIdx = 0;
    renderPills();
    renderTask();
  }

  function nextTask() {
    const variant = database[curSubjIdx].variants[curVarIdx];
    if (curTaskIdx < variant.tasks.length - 1) {
      curTaskIdx++;
      renderPills();
      renderTask();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  }

  function renderPills() {
    const container = document.getElementById("taskPills");
    container.innerHTML = "";
    const variant = database[curSubjIdx].variants[curVarIdx];
    variant.tasks.forEach((t, idx) => {
      const pill = document.createElement("div");
      const key = `${variant.id}_${t.num}`;
      pill.className = "pill" + (idx === curTaskIdx ? " active" : "") + (solvedTasks[key] ? " solved" : "");
      pill.textContent = t.num;
      if (!t.free && !isPro) {
        const lock = document.createElement("span");
        lock.className = "lock";
        lock.textContent = "🔒";
        pill.appendChild(lock);
      }
      pill.onclick = () => { curTaskIdx = idx; renderPills(); renderTask(); };
      container.appendChild(pill);
    });
  }

  function renderTask() {
    const variant = database[curSubjIdx].variants[curVarIdx];
    const task = variant.tasks[curTaskIdx];
    const card = document.getElementById("taskCard");
    const hasNext = curTaskIdx < variant.tasks.length - 1;

    if (!task.free && !isPro) {
      card.innerHTML = `
        <div class="task-topic">${task.topic}</div>
        <div class="task-title">${task.title}</div>
        <div class="task-condition">${task.condition}</div>
        <div style="text-align:center; padding: 14px 0;">
          <div style="font-size: 30px; margin-bottom: 8px;">🔒</div>
          <p style="color: var(--muted); font-size: 14px; margin-bottom: 12px;">
            Разбор «на пальцах», ловушка ЕГЭ и шпаргалка к этому заданию доступны в полной версии.
          </p>
          <button class="btn btn-primary" onclick="buyPro()">Открыть за 15 ⭐ (~30 ₽)</button>
        </div>
        ${hasNext ? `<button class="btn btn-next" onclick="nextTask()">Следующее задание ➔</button>` : ""}
      `;
      return;
    }
    
    card.innerHTML = `
      <div class="task-topic">${task.topic}</div>
      <div class="task-title">${task.title}</div>
      <div class="task-condition">${task.condition}</div>

      <div class="answer-box">
        <input type="text" id="userAnswer" placeholder="Введи ответ..." />
        <button class="btn btn-primary" onclick="checkAnswer()">Проверить</button>
      </div>

      <div class="feedback" id="feedbackBox"></div>

      <button class="btn btn-kid" onclick="document.getElementById('explanationBox').classList.toggle('open')">
        👶 Объяснить по шагам как ребенку
      </button>

      <div class="explanation" id="explanationBox">
        <div class="kid-block">
          <h4>💡 Простая аналогия (суть за 10 секунд)</h4>
          <p>${task.analogy}</p>
        </div>

        <h4 style="margin-bottom: 10px; font-size: 15px;">🪜 Пошаговое решение:</h4>
        ${task.steps.map((s, i) => `
          <div class="step">
            <div class="step-num">${i + 1}</div>
            <div class="step-text">${s}</div>
          </div>
        `).join("")}

        <div class="trap-box"><strong>⚠️ Подвох ЕГЭ:</strong> ${task.trap}</div>
        ${task.cheatsheet ? `<div class="cheat-box"><strong>📌 Шпаргалка:</strong> ${task.cheatsheet}</div>` : ""}
      </div>

      ${hasNext ? `<button class="btn btn-next" onclick="nextTask()">Следующее задание ➔</button>` : ""}
    `;
  }

  function checkAnswer() {
    const variant = database[curSubjIdx].variants[curVarIdx];
    const task = variant.tasks[curTaskIdx];
    const input = document.getElementById("userAnswer").value.trim().toLowerCase().replace(",", ".");
    const correct = task.answer.toLowerCase().replace(",", ".");
    const fb = document.getElementById("feedbackBox");
    if (!input) return;

    if (input === correct) {
      fb.className = "feedback ok";
      fb.textContent = "🎉 Верно! Отличная работа!";
      solvedTasks[`${variant.id}_${task.num}`] = true;
      localStorage.setItem("ege_solved", JSON.stringify(solvedTasks));
      renderPills();
    } else {
      fb.className = "feedback err";
      fb.textContent = "❌ Пока неверно. Открой разбор ниже — там всё объяснено простым языком!";
      document.getElementById("explanationBox").classList.add("open");
    }
  }

  async function buyPro() {
    if (!tg || !tg.initData) {
      alert("Оплата в Telegram Stars работает при запуске приложения внутри Telegram-бота.");
      return;
    }

    try {
      const res = await fetch("https://ege-pay.iaprogdev.workers.dev");
      const data = await res.json();

      if (data.ok && data.invoiceLink) {
        tg.openInvoice(data.invoiceLink, function(status) {
          if (status === "paid") {
            isPro = true;
            localStorage.setItem("ege_pro", "true");
            initUI();
            tg.showAlert("🎉 Оплата прошла успешно! Открыт полный доступ ко всем заданиям.");
          } else if (status === "failed") {
            tg.showAlert("❌ Оплата не прошла. Попробуйте ещё раз.");
          }
        });
      } else {
        tg.showAlert("Не удалось создать счёт. Попробуйте позже.");
      }
    } catch (e) {
      tg.showAlert("Ошибка соединения с сервером оплаты.");
    }
  }
                     


  initUI();
</script>
</body>
</html>
